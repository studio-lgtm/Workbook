<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nate J Minnick</title>
    <meta name="description" content="Portfolio of Nate J Minnick — Designer and Creative Director">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Home View -->
    <div class="view" id="view-home">
        <main class="home-main">
            <div class="home-slideshow" id="homeSlideshow"></div>
        </main>
        <header class="header">
            <div class="header-identity">
                <a href="/" class="nav-link">Nate J Minnick</a><span class="nav-sep">, </span><a href="#" class="nav-link info-link">Information</a><span class="nav-sep">, </span><a href="#" class="nav-link" id="openProjects">Index</a>
            </div>
        </header>
    </div>

    <!-- Projects List View (default Index) -->
    <div class="view view--hidden" id="view-list">
        <main class="list-main">
            <div class="list-index" id="listIndex"></div>
        </main>
        <header class="header">
            <div class="header-identity">
                <a href="/" class="nav-link">Nate J Minnick</a><span class="nav-sep">, </span><a href="#" class="nav-link info-link">Information</a><span class="nav-sep">, </span><a href="#" class="nav-link" id="closeList">Index</a>
            </div>
            <div class="view-toggle">
                <a href="#" class="nav-link toggle-list nav-active">List</a><span class="nav-link toggle-sep">/</span><a href="#" class="nav-link toggle-grid">Grid</a>
            </div>
        </header>
    </div>

    <!-- Projects Gallery View -->
    <div class="view view--hidden" id="view-projects">
        <main class="gallery-main">
            <div class="gallery-grid" id="galleryGrid"></div>
        </main>
        <header class="header">
            <div class="header-identity">
                <a href="/" class="nav-link">Nate J Minnick</a><span class="nav-sep">, </span><a href="#" class="nav-link info-link">Information</a><span class="nav-sep">, </span><a href="#" class="nav-link" id="closeProjects">Index</a>
            </div>
            <div class="view-toggle">
                <a href="#" class="nav-link toggle-list">List</a><span class="nav-link toggle-sep">/</span><a href="#" class="nav-link toggle-grid nav-active">Grid</a>
            </div>
        </header>
    </div>

    <!-- Project Detail View (Lightbox) -->
    <div class="view view--hidden" id="view-project">
        <div class="project-scroll" id="projectScroll"></div>
        <header class="header">
            <div class="project-info-header">
                <div class="project-nav-combined" id="projectNavInfo"></div>
                <div class="project-nav-mobile" id="projectNavMobile">
                    <div class="project-mobile-row">
                        <span id="projectInfoTitleM"></span><span class="project-mobile-sep"> — </span><button class="project-info-toggle" id="projectInfoToggle">Details</button><span class="project-mobile-desc" id="projectInfoDrawer"><span id="projectInfoDescM"></span></span>
                    </div>
                    <button class="project-info-close" id="projectInfoClose">Hide</button>
                </div>
            </div>
            <a href="#" class="nav-link" id="closeProject">Close</a>
        </header>
    </div>

    <!-- Info Panel (revealed when views slide down) -->
    <div id="info-panel">
        <div id="info-panel-content"></div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
