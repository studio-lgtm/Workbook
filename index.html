<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nate J Minnick</title>
    <meta name="description" content="Portfolio of Nate J Minnick — Designer and Creative Director">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Home View -->
    <div class="view" id="view-home">
        <header class="header">
            <nav class="nav">
                <a href="#" class="nav-link" id="openProjects">Projects</a>
                <a href="about.html" class="nav-link">Information</a>
                <a href="mailto:studio@natejminnick.com" class="nav-link">Contact</a>
            </nav>
            <span class="logo">Nate J Minnick</span>
        </header>
        <main class="home-main">
            <div class="home-slideshow" id="homeSlideshow"></div>
        </main>
    </div>

    <!-- Projects Gallery View -->
    <div class="view view--hidden" id="view-projects">
        <header class="header">
            <a href="#" class="nav-link" id="closeProjects">Close</a>
        </header>
        <main class="gallery-main">
            <div class="gallery-grid" id="galleryGrid"></div>
        </main>
    </div>

    <!-- Project Detail View -->
    <div class="view view--hidden" id="view-project">
        <header class="header">
            <a href="#" class="nav-link" id="closeProject">Close</a>
        </header>
        <div class="project-scroll" id="projectScroll"></div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
