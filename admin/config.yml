backend:
  name: git-gateway
  branch: main

media_folder: "media"
public_folder: "/media"

# For video uploads without file size limits, you need one of these:

# OPTION 1: Get free Uploadcare account (recommended - easiest setup)
# Sign up at https://uploadcare.com (free tier: 3GB storage, 3GB CDN traffic/month)
# Then replace YOUR_PUBLIC_KEY below with your actual key
# media_library:
#   name: uploadcare
#   config:
#     publicKey: YOUR_PUBLIC_KEY
#     imagesOnly: false

# OPTION 2: Use Netlify Large Media (if hosting on Netlify)
# Run these commands in your terminal:
# netlify plugins:install netlify-lm-plugin
# netlify lm:install
# netlify lm:setup
# Then uncomment this:
# media_library:
#   name: netlify-large-media

# OPTION 3: No external service (default Git - has ~10MB limit)
# Leave media_library commented out (current setup)
# For larger videos, compress them first or use external hosting

collections:
  - name: "info"
    label: "Info"
    files:
      - label: "Info Page"
        name: "info"
        file: "info.json"
        fields:
          - label: "Body"
            name: "body"
            widget: "markdown"
            hint: "The text shown on the Info page. Use the editor to add links, formatting, etc."

  - name: "homepage"
    label: "Homepage"
    files:
      - label: "Homepage Assets"
        name: "homepage"
        file: "landing.json"
        fields:
          - label: "Assets (click through on homepage)"
            name: "images"
            widget: "list"
            summary: '{{fields.url}}'
            fields:
              - { label: "Type", name: "type", widget: "select", options: ["image", "video"], default: "image" }
              - { label: "File", name: "url", widget: "file", required: true, hint: "Upload image or video" }
              - { label: "Alt Text", name: "alt", widget: "string", required: false }

  - name: "projects"
    label: "Projects"
    files:
      - label: "All Projects"
        name: "projects"
        file: "projects.json"
        fields:
          - label: "Projects"
            name: "projects"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Hidden", name: "hidden", widget: "boolean", required: false, default: false, hint: "If enabled, project is completely hidden from the site." }
              - { label: "Locked (Confidential)", name: "locked", widget: "boolean", required: false, default: false, hint: "If enabled, shows 'Confidential' label in the gallery and blocks access." }
              - label: "Thumbnail (projects grid)"
                name: "thumbnail"
                widget: "image"
                required: false
                hint: "Image shown in the projects grid. If empty, first image from media is used."
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Credits (HTML)", name: "credits", widget: "text", required: false, hint: "Use HTML tags like <p> and <strong>" }
              - { label: "External Link", name: "link", widget: "string", required: false }
              - { label: "Lightbox Background Color", name: "backgroundColor", widget: "string", required: false, default: "#000000", hint: "Hex code for the project lightbox background, e.g. #1a1a2e" }
              - label: "Media"
                name: "media"
                widget: "list"
                summary: '{{fields.type}}: {{fields.url}}'
                fields:
                  - { label: "Type", name: "type", widget: "select", options: ["image", "image-pair", "video", "video-pair"] }
                  - label: "File (Image or Video)"
                    name: "url"
                    widget: "file"
                    required: true
                    hint: "Upload your image or video file here. For image-pair, this is the LEFT image."
                    allow_multiple: false
                  - label: "Second File (image-pair: right image / video-pair: right video)"
                    name: "url2"
                    widget: "file"
                    required: false
                    hint: "For image-pair or video-pair: Upload the RIGHT image or video."
                  - label: "Poster Image (video thumbnail — left)"
                    name: "poster"
                    widget: "image"
                    required: false
                    hint: "For video or video-pair: thumbnail for the left/only video."
                  - label: "Poster Image 2 (video-pair right thumbnail)"
                    name: "poster2"
                    widget: "image"
                    required: false
                    hint: "For video-pair only: thumbnail for the right video."
                  - { label: "Alt Text", name: "alt", widget: "string", required: false }
                  - { label: "Alt Text 2 (image-pair only)", name: "alt2", widget: "string", required: false }
                  - { label: "Autoplay (video)", name: "autoplay", widget: "boolean", required: false, default: false }
                  - { label: "Loop (video)", name: "loop", widget: "boolean", required: false, default: false }
                  - { label: "Muted (video)", name: "muted", widget: "boolean", required: false, default: true }
